[package]
name = "reth_hl"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "reth_hl"
path = "src/lib.rs"

[[bin]]
name = "reth-hl"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[dependencies]
reth = { git = "https://github.com/sentioxyz/reth", branch = "release/v1.8.2-hyper" }
reth-cli = { git = "https://github.com/sentioxyz/reth", branch = "release/v1.8.2-hyper" }
